<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="100%" font-family="ui-monospace, 'JetBrains Mono', 'Fira Code', Menlo, Consolas, monospace" role="img" aria-labelledby="title desc">
  <title id="title">GALIMEDE — HYPERTEXT TECHNICIAN — INTERFACE DIVISION</title>
  <desc id="desc">Animated terminal boot sequence in Catppuccin Mocha × cassette-futurism palette. POST checks stream in, followed by a populated specimen identity card for GALIMEDE / Mathieu Degand, with idle-spinning tape reels in the corner.</desc>

  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%">
      <stop offset="55%" stop-color="#1e1e2e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="900" height="360" fill="#1e1e2e"/>

  <!-- CRT bezel / frame -->
  <rect x="8" y="8" width="884" height="344" rx="6" fill="#313244" stroke="#45475a" stroke-width="2"/>
  <rect x="20" y="20" width="860" height="320" rx="3" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>

  <!-- Corner rivets -->
  <circle cx="22" cy="22" r="2.5" fill="#45475a" stroke="#6c7086" stroke-width="0.6"/>
  <circle cx="878" cy="22" r="2.5" fill="#45475a" stroke="#6c7086" stroke-width="0.6"/>
  <circle cx="22" cy="338" r="2.5" fill="#45475a" stroke="#6c7086" stroke-width="0.6"/>
  <circle cx="878" cy="338" r="2.5" fill="#45475a" stroke="#6c7086" stroke-width="0.6"/>

  <!-- Top-left power LED (subtle pulse) -->
  <circle cx="36" cy="36" r="3" fill="#a6e3a1">
    <animate attributeName="fill-opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="39" font-size="8" font-weight="600" fill="#a6adc8" letter-spacing="0.6">PWR</text>

  <!-- Top-right stamp -->
  <text x="872" y="39" text-anchor="end" font-size="9" font-weight="500" fill="#a6adc8" letter-spacing="0.8">UNIT 0426 · REV.MK.IV · W-Y</text>

  <!-- POST boot lines (two-stage: dots then OK) -->
  <g font-size="13" fill="#fab387" font-weight="500">
    <text x="40" y="68" opacity="0">&gt; POWER ON SELF-TEST ..............  <tspan opacity="0">OK<set attributeName="opacity" to="1" begin="0.45s" fill="freeze"/></tspan><set attributeName="opacity" to="1" begin="0.3s" fill="freeze"/></text>
    <text x="40" y="86" opacity="0">&gt; MEM CHECK 0x4A00 ................  <tspan opacity="0">OK<set attributeName="opacity" to="1" begin="0.75s" fill="freeze"/></tspan><set attributeName="opacity" to="1" begin="0.6s" fill="freeze"/></text>
    <text x="40" y="104" opacity="0">&gt; CHECKSUM 0x4A ...................  <tspan opacity="0">OK<set attributeName="opacity" to="1" begin="1.05s" fill="freeze"/></tspan><set attributeName="opacity" to="1" begin="0.9s" fill="freeze"/></text>
    <text x="40" y="122" opacity="0">&gt; LOADING MOD: HYPERTEXT ..........  <tspan opacity="0">OK<set attributeName="opacity" to="1" begin="1.35s" fill="freeze"/></tspan><set attributeName="opacity" to="1" begin="1.2s" fill="freeze"/></text>
    <text x="40" y="140" opacity="0">&gt; IDENTIFYING OPERATOR ............  <tspan fill="#f9e2af" opacity="0">OK<set attributeName="opacity" to="1" begin="1.65s" fill="freeze"/></tspan><set attributeName="opacity" to="1" begin="1.5s" fill="freeze"/></text>
  </g>

  <!-- Horizontal rule (drawn in) -->
  <line x1="40" y1="158" x2="40" y2="158" stroke="#fab387" stroke-width="1" stroke-opacity="0.6">
    <animate attributeName="x2" from="40" to="860" begin="1.9s" dur="0.5s" fill="freeze"/>
  </line>

  <!-- Spec sheet card (border draws in, then body + fields populate) -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="2.4s" fill="freeze"/>

    <!-- Card body (fill + static text + dividers), fades in after border completes -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.25s" fill="freeze"/>
      <rect x="40" y="175" width="820" height="130" rx="2" fill="#313244"/>
      <rect x="40" y="175" width="820" height="20" fill="#45475a"/>
      <text x="52" y="190" font-size="11" font-weight="600" fill="#f9e2af" letter-spacing="1">▸ UNIT 0426 · CLASS G-1 · SPECIMEN LABEL</text>
      <text x="848" y="190" text-anchor="end" font-size="10" font-weight="500" fill="#a6adc8" letter-spacing="0.6">[ FORM 47-B ]</text>
      <line x1="450" y1="200" x2="450" y2="298" stroke="#45475a" stroke-width="1"/>
      <line x1="52" y1="282" x2="838" y2="282" stroke="#45475a" stroke-width="0.5" stroke-dasharray="2 2"/>
    </g>

    <!-- Border traces in like a line printer (2.4s → 2.9s), drawn on top -->
    <rect x="40" y="175" width="820" height="130" rx="2" fill="none" stroke="#45475a" stroke-width="1"
          stroke-dasharray="1900" stroke-dashoffset="1900">
      <animate attributeName="stroke-dashoffset" from="1900" to="0" begin="2.4s" dur="0.5s" fill="freeze"/>
    </rect>

    <!-- Left column fields -->
    <g font-size="12" font-weight="500">
      <text x="52" y="218" fill="#a6adc8" opacity="0">NAME<set attributeName="opacity" to="1" begin="3.25s" fill="freeze"/></text>
      <text x="168" y="218" fill="#cdd6f4" opacity="0">GALIMEDE<set attributeName="opacity" to="1" begin="3.30s" fill="freeze"/></text>

      <text x="52" y="236" fill="#a6adc8" opacity="0">DESIGNATION<set attributeName="opacity" to="1" begin="3.45s" fill="freeze"/></text>
      <text x="168" y="236" fill="#cdd6f4" opacity="0">MATHIEU DEGAND<set attributeName="opacity" to="1" begin="3.50s" fill="freeze"/></text>

      <text x="52" y="254" fill="#a6adc8" opacity="0">CLASSIFICATION<set attributeName="opacity" to="1" begin="3.65s" fill="freeze"/></text>
      <text x="168" y="254" fill="#fab387" opacity="0">HYPERTEXT TECHNICIAN<set attributeName="opacity" to="1" begin="3.70s" fill="freeze"/></text>

      <text x="52" y="272" fill="#a6adc8" opacity="0">DIVISION<set attributeName="opacity" to="1" begin="3.85s" fill="freeze"/></text>
      <text x="168" y="272" fill="#cdd6f4" opacity="0">INTERFACE DIVISION<set attributeName="opacity" to="1" begin="3.90s" fill="freeze"/></text>
    </g>

    <!-- Right column fields -->
    <g font-size="12" font-weight="500">
      <text x="462" y="218" fill="#a6adc8" opacity="0">SERIAL<set attributeName="opacity" to="1" begin="4.05s" fill="freeze"/></text>
      <text x="568" y="218" fill="#cdd6f4" opacity="0">PERS. G1-0426 · W-Y<set attributeName="opacity" to="1" begin="4.10s" fill="freeze"/></text>

      <text x="462" y="236" fill="#a6adc8" opacity="0">REVISION<set attributeName="opacity" to="1" begin="4.25s" fill="freeze"/></text>
      <text x="568" y="236" fill="#cdd6f4" opacity="0">MK.IV<set attributeName="opacity" to="1" begin="4.30s" fill="freeze"/></text>

      <text x="462" y="254" fill="#a6adc8" opacity="0">MFG DATE<set attributeName="opacity" to="1" begin="4.45s" fill="freeze"/></text>
      <text x="568" y="254" fill="#cdd6f4" opacity="0">16.10<set attributeName="opacity" to="1" begin="4.50s" fill="freeze"/></text>

      <text x="462" y="272" fill="#a6adc8" opacity="0">ORIGIN COORDS<set attributeName="opacity" to="1" begin="4.65s" fill="freeze"/></text>
      <text x="568" y="272" fill="#f38ba8" opacity="0">[REDACTED]<set attributeName="opacity" to="1" begin="4.70s" fill="freeze"/></text>
    </g>

    <!-- Status row -->
    <g font-size="12" font-weight="600">
      <text x="52" y="298" fill="#a6adc8" opacity="0">STATUS<set attributeName="opacity" to="1" begin="4.95s" fill="freeze"/></text>
      <text x="168" y="298" fill="#a6e3a1" opacity="0">▮ OPERATIONAL<set attributeName="opacity" to="1" begin="5.00s" fill="freeze"/></text>
      <text x="264" y="298" fill="#fab387" opacity="0">_<set attributeName="opacity" to="1" begin="5.25s" fill="freeze"/><animate attributeName="opacity" values="1;0;1" dur="1s" begin="5.25s" repeatCount="indefinite"/></text>
    </g>
  </g>

  <!-- Tape reels (always present, idle-spinning from t=0) -->
  <g>
    <!-- Tape strips connecting the reels -->
    <path d="M 760 322 Q 800 318 840 322" fill="none" stroke="#6c7086" stroke-width="1" stroke-opacity="0.6"/>
    <path d="M 760 334 Q 800 338 840 334" fill="none" stroke="#6c7086" stroke-width="1" stroke-opacity="0.6"/>

    <!-- Reel 1 -->
    <g transform="translate(760 328)">
      <g>
        <circle cx="0" cy="0" r="11" fill="#1e1e2e" stroke="#45475a" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="3" fill="#45475a"/>
        <g fill="none" stroke="#6c7086" stroke-width="0.9" stroke-linecap="round">
          <line x1="-8" y1="0" x2="-4" y2="0"/>
          <line x1="8" y1="0" x2="4" y2="0"/>
          <line x1="0" y1="-8" x2="0" y2="-4"/>
          <line x1="0" y1="8" x2="0" y2="4"/>
          <line x1="-5.6" y1="-5.6" x2="-2.8" y2="-2.8"/>
          <line x1="5.6" y1="5.6" x2="2.8" y2="2.8"/>
          <line x1="-5.6" y1="5.6" x2="-2.8" y2="2.8"/>
          <line x1="5.6" y1="-5.6" x2="2.8" y2="-2.8"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- Reel 2 -->
    <g transform="translate(840 328)">
      <g>
        <circle cx="0" cy="0" r="11" fill="#1e1e2e" stroke="#45475a" stroke-width="1.2"/>
        <circle cx="0" cy="0" r="3" fill="#45475a"/>
        <g fill="none" stroke="#6c7086" stroke-width="0.9" stroke-linecap="round">
          <line x1="-8" y1="0" x2="-4" y2="0"/>
          <line x1="8" y1="0" x2="4" y2="0"/>
          <line x1="0" y1="-8" x2="0" y2="-4"/>
          <line x1="0" y1="8" x2="0" y2="4"/>
          <line x1="-5.6" y1="-5.6" x2="-2.8" y2="-2.8"/>
          <line x1="5.6" y1="5.6" x2="2.8" y2="2.8"/>
          <line x1="-5.6" y1="5.6" x2="-2.8" y2="2.8"/>
          <line x1="5.6" y1="-5.6" x2="2.8" y2="-2.8"/>
        </g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>

  <!-- Scanline overlay -->
  <rect width="900" height="360" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Vignette -->
  <rect width="900" height="360" fill="url(#vignette)" pointer-events="none"/>
</svg>
